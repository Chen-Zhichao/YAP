# Full D2W parameter layout, matching configs/design_6_4hi_p6.
# New assembly-order engineering preview, not a reference population-yield reproduction.
# ASSEMBLY_ORDER_ENABLED selects reduced Cu-history modeling and overlay yield only.
# Particle, chiplet, dishing, peeling, roughness and ESD groups are retained but inactive.
# Legacy equivalent-material and bow-distribution settings do not drive this ROM.
# stack.yaml and the native operator/material/process data remain authoritative.
# The simulation section is reserved; use calculator_main.py with the modeling mode.

#### ==================================================================== ####
#### Simulation parameters for Die-to-Wafer (D2W) hybrid bonding simulation.
#### ==================================================================== ####
d2w_simulation:
  # === Assembly-Order Controls ===
  # Reduced Cu-history modeling and overlay scoring; other mechanisms are inactive.
  # Reserved section: assembly-order simulation is not implemented.
  ASSEMBLY_ORDER_ENABLED: true
  MAGNIFICATION_CORRECTION: 0.86
  OVERLAY_SAMPLES: 8192
  RANDOM_SEED: 2026091601
  MIN_AVAILABLE_MEMORY_GIB: 40.0

  # === General Settings ===
  MODE: "D2W_Hybrid_Bonding_Simulation" # Name of the simulation
  OUTPUT_DIR: /app/nanocad/projects/personal/zchen/YAP_STACK/YAP/D2W/output/assembly_orders
  INPUT_DIR: input/design_6_4hi_p2/  # Design inputs; --ds_dir selects the runtime input directory.
  DEBUG: false                          # Enable debug mode
  DESIGN: design_6_4hi_p2
  INTERFACE: null  # Resolved for each physical interface at runtime.
 # === Die Settings ===
  NUM_DIE_STACKS: 100000                         # Number of die stacks used in simulation
  SIM_BATCH_SIZE: 1000                           # Number of die samples simulated in one batch
  CHIP_DEFECT_DENSITY_PER_CM2: 0.09            # Current fabrication scenario (defects/cm^2), 2026-09-16
  CHIP_CRITICAL_AREA_FRACTION: 0.7             # CATCH Table I 3 nm critical-area fraction
  CHIP_DEFECT_CLUSTERING_ALPHA: 2.0            # CATCH negative-binomial clustering factor
  KNOWN_GOOD_DIE_REFERENCES: []  # Legacy chiplet-yield input; not scored in assembly-order mode.
  PITCH_r_um: 2.0  # Row pad pitch (um) (In checkerboard layout, this is sqrt(2)/2 times of the real pitch)
  PITCH_c_um: 2.0  # Column pad pitch (um)  (In checkerboard layout, this is sqrt(2)/2 times of the real pitch)
  DIE_W_um: 10000.0  # Die width (um)
  DIE_L_um: 10000.0  # Die length (um)
  PAD_ARR_ROW: 5000
  PAD_ARR_COL: 5000
  PAD_BOT_R_um: 0.5  # Bottom Cu pad radius (um)
  PAD_TOP_R_um: 0.5  # Top Cu pad radius (um)
  VOID_SHAPE: "circle"                  # Void shape: "circle" or "square"
  dice_width: 100                      # Width of one die (um)
  pad_yield_flag: False
  pad_yield_map_sub_factor: 1          # Subsampling factor for pad yield map (1: no subsampling, 10: rows/10 and cols/10)
  PAD_ARRANGE_PATTERN: rectangular
  LAYOUT_KIND: regular_center_io
  CRITICAL_PAD_FRACTION: 0.3
  POWER_GROUND_PAD_FRACTION: 0.5
  DUMMY_PAD_FRACTION: 0.2
  ITF_TOP_THICK_um: 50.0  # Top die thickness (um)
  ITF_BOT_THICK_um: 50.0  # Bottom die thickness (um)

  # === Die Legacy Equivalent-Material Warpage (inactive in assembly-order mode) ===
  # === Bottom Wafer Settings ===
  B_Chip_Cu_V: 0.35                     # Baseline BEOL Cu volume fraction
  B_Chip_Sio2_V: 0.65                   # Remaining effective bonding-layer fraction
  B_Chip_Si_V: 0.00                     # Efficient bonding layer Si volume density
  B_Chip_T: 1.5e-6                      # Efficient bonding layer thickness (m)
  B_Sub_Cu_V: 0.10                      # Efficient substrate layer Cu volume density
  B_Sub_Sio2_V: 0.00                    # Efficient substrate layer Sio2 volume density
  B_Sub_Si_V: 0.90                      # Efficient substrate layer si volume density
  B_Sub_T: None                       # Efficient substrate layer thickness (m)
  S_INIT_A_M: null  # Unused in assembly-order mode; fixed bows are in stack.yaml.
  # === Top Wafer Settings ===
  T_Chip_Cu_V: 0.35                     # Baseline BEOL Cu volume fraction
  T_Chip_Sio2_V: 0.65                   # Remaining effective bonding-layer fraction
  T_Chip_Si_V: 0.00                     # Efficient bonding layer Si volume density
  T_Chip_T: 1.5e-6                      # Efficient bonding layer thickness (m)
  T_Sub_Cu_V: 0.10                      # Efficient substrate layer Cu volume density
  T_Sub_Sio2_V: 0.00                    # Efficient substrate layer Sio2 volume density
  T_Sub_Si_V: 0.90                      # Efficient substrate layer si volume density
  T_Sub_T: None                       # Efficient substrate layer thickness (m)
  S_INIT_B_M: null  # Unused in assembly-order mode; fixed bows are in stack.yaml.



  CONTACT_AREA_CONSTRAINT: 0.75  # Minimum allowed contact area ratio
  CRITICAL_DIST_CONSTRAINT: 0.75  # Minimum distance constraint for critical pads

  # === Misalignment Parameters ===
  RANDOM_MISALIGNMENT_MEAN_um: 0.0  # Random misalignment mean (um)
  RANDOM_MISALIGNMENT_STD_um: 0.006666666666666667  # Random overlay sigma: 20 nm / 3
  SYSTEM_TRANSLATION_X_MEAN_um: 0.0  # Systematic X translation mean (um)
  SYSTEM_TRANSLATION_X_STD_um: 0.04  # D2D translation sigma: 120 nm / 3
  SYSTEM_TRANSLATION_Y_MEAN_um: 0.0  # Systematic Y translation mean (um)
  SYSTEM_TRANSLATION_Y_STD_um: 0.04  # D2D translation sigma: 120 nm / 3
  SYSTEM_ROTATION_MEAN_rad: 0.0  # D2D rotation mean (rad)
  SYSTEM_ROTATION_STD_rad: 5.633333333333333e-06  # D2D rotation sigma: 16.9 urad / 3

  # === Bowing and Magnification ===
  TOP_INI_BOW_MEAN_um: null  # Unused in assembly-order mode; fixed bows are in stack.yaml.
  TOP_INI_BOW_STD_um: null  # Unused in assembly-order mode; fixed bows are in stack.yaml.
  BOT_INI_BOW_MEAN_um: null  # Unused in assembly-order mode; fixed bows are in stack.yaml.
  BOT_INI_BOW_STD_um: null  # Unused in assembly-order mode; fixed bows are in stack.yaml.
  k_mag: 0.1                           # Magnification slope coefficient
  M_0: 0                                # Magnification offset
  STACK_WARPAGE_TH: 20.0                # Total stack warpage threshold (um)
  ANNEAL_MODE: sequential  # Free anneal after each assembly-tree merge.

  # === Defect Parameters (inactive in assembly-order mode) ===
  first_contact: 'center'            # First contact location: 'center' or 'edge' or 'corner (left-top)'
  D0: 1e-9                              # Particle density (1/um^2)
  D1: 1e-9                              # Edge peak particle density (1/um^2)
  EDGE_REGION_WIDTH_um: 300.0           # Width of the edge region for elevated particle density (um)
  z: 3                                  # Particle thickness distribution exponent
  t_0: 0.1                                # Minimum particle thickness (um)
  k_r: 1.8e-4
  k_r0: 230
  k_L: 6.2e-2
  k_n: 9e-5
  k_S: 2.7

  # === Cu Dishing Parameters (inactive in assembly-order mode) ===
  CU_RECESS_PAD_FAIL_RATIO: 0.0         # Ratio of pads with Cu recess > threshold to consider die as failed
  CU_RECESS_DIE_LEVEL_THRESHOLD_PADS: 100000
  TOP_DISH_MEAN_nm: -2.2                  # Top pad dish mean (nm)
  TOP_DISH_STD_nm: 0.35                  # One-level Cu dishing std (nm)
  BOT_DISH_MEAN_nm: -2.2                  # Bottom pad dish mean (nm)
  BOT_DISH_STD_nm: 0.35                  # One-level Cu dishing std (nm)
  k_et: 0.053                           # Top Cu expansion coefficient (nm/K)
  k_eb: 0.053                           # Bottom Cu expansion coefficient (nm/K)
  T_R: 25.0  # Room temperature (degC)
  T_anl: 350.0  # Baseline annealing temperature (degC)
  CU_E_GPA: 91.8                        # Cu Young's modulus (GPa)
  CU_NU: 0.34                           # Cu Poisson's ratio
  CU_ALPHA_PPM: 17.6                    # Cu coefficient of thermal expansion (CTE) (ppm/degC)
  OX_E_GPA: 73.0                        # Sio2 Young's modulus (GPa)
  OX_NU: 0.17                           # Sio2 Poisson's ratio
  OX_ALPHA_PPM: 0.5                     # Sio2 coefficient of thermal expansion (CTE) (ppm/degC)
  SI_E_GPA: 131.0                        # Si Young's modulus (GPa)
  SI_NU: 0.28                           # Si Poisson's ratio
  SI_ALPHA_PPM: 2.6                     # Si coefficient of thermal expansion (CTE) (ppm/degC)

  # === Cu & Sio2 peeling stress model Parameters (inactive in assembly-order mode) ===
  # === heat up and dwell stage ===
  SIGMA_Y_MPA: 321.0                    # Elastic yield point (MPa)
  C_HEAT_E: 1.005319e-12                       # Eq.(29) coefficient for sigma_e
  C_HEAT_P: 6.088622e-6                       # Eq.(29) coefficient for sigma_p
  C_COOL_E: 3.375203e-6                       # Eq.(35) coefficient for sigma_e,cool
  C_COOL_P: 3.721387e-6                       # Eq.(35) coefficient for sigma_p,cool
  EXP_PHI: 0.206576                          # Eq.(30)
  BAUSCHINGER: 0.208455                      # Eq.(33)
  EXP_INVPHI: 0.1                       # Eq.(36)
  EXP_AREA: 0.0465                         # Eq.(36)
  KN_DEN_M: 17.310513e-6                         # Eq.(31) denominator length in meters
  # === Roughness Parameters (inactive in assembly-order mode) ===
  Asperity_R_m: 2e-6                      # Asperity curvature radius (m)
  Roughness_sigma_m: 0.5e-9                 # Surface roughness std (m)
  eta_s: 40e12                          # Asperity density (1/m^2)
  Roughness_constant: 0.07
  Adhesion_energy: 1.2                  # Adhesion energy (J/m^2)
  Dielectric_Young_modulus_Pa: 7.3e10                 # Young's modulus (Pa)
  Dielectric_thickness: 1.5e-6          # Dielectric thickness (m)
  DISH_0_m: 75e-9                         # Reference dish depth (m)
  k_peel: 6.66e12                       # Peel force constant (N/m^4/K)\

  # === Adhesion_energy to Critical Peeling Stress Model Parameters (inactive in assembly-order mode) ===
  # sigma = Effective_Contact_Area * ((Gc_Jpm2 * E_GPa) / (CRIT_aY2_UM * (1.0 - NU**2)))^(1/2)
  CRIT_aY2_UM: 1.90                    # Geometric/Compliance factor (um)
  GC_SIO2_JPM2: 2.0                     # Sio2 Adhesion energy (J/m^2)
  GC_CU_JPM2: 25.0                      # Cu Adhesion energy (J/m^2)
  Effective_Contact_Area: 1.0           # Fraction of pad area effectively bearing normal load

  # === ESD Parameters (inactive in assembly-order mode) ===
  TILT_X_MEAN_DEG: 0.000
  TILT_X_STD_DEG: 1e-5
  TILT_Y_MEAN_DEG: 0.000
  TILT_Y_STD_DEG: 1e-5
  V_CDM: 5.0
  WEIBULL_K: 4.44985
  WEIBULL_LAMBDA: 0.0621816
  CUTOFF_MIN_A: 0.0
  ESD_PAD_MAP_SUB_FACTOR: 0

  # === Simulation Control ===
  simulation_times: 1                  # Number of simulation iterations
  approximate_set: 1                   # 1: enable overlay simulation approximation, 0: disable

  # === Miscellaneous Parameters ===
  plot_flag: True                      # Enable plotting of results
  verbose: False


