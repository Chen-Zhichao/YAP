# New fixed-bow prepared-die column study, not a frozen reference reproduction.
# Die_1 is the receiving die-site abstraction, not an explicit whole wafer.
stack:
  initial_bows_um: [10.0, -10.0, 20.0, -20.0]
  assembly_orders: all
  # Balanced/right-nested trees include offline D2D substack preparation.
  allow_offline_substacks: true
  geometry:
    width_mm: 10.0
    length_mm: 10.0
    total_thickness_um: 50.0
    front_bi_thickness_um: 1.5
    back_bi_thickness_um: 1.5
    beol_thickness_um: 10.0
  # Both BIs already exist; no thinning or BI deposition during assembly.
  fabrication_layers:
    - {name: front_BI, thickness_um: 1.5, e_mpa: 84388.273369263, nu: 0.20337942194439157, eigenstrain_per_amplitude: 0.0}
    - {name: BEOL, thickness_um: 10.0, e_mpa: 93300.0, nu: 0.2295, eigenstrain_per_amplitude: 1.0}
    - {name: Si, thickness_um: 37.0, e_mpa: 99496.90200129498, nu: 0.2917809724509618, eigenstrain_per_amplitude: 0.0}
    - {name: back_BI, thickness_um: 1.5, e_mpa: 84388.273369263, nu: 0.20337942194439157, eigenstrain_per_amplitude: 0.0}
  process:
    room_temperature_c: 25.0
    anneal_temperature_c: 350.0
    ramp_up_s: 650.0
    dwell_s: 3600.0
    cool_down_s: 650.0

mechanics:
  operator_package: resource:compact_p2/packages/BI2_50.json
  temporal_profile: distilled26
  layer_workers: 1
  # Full square retains the actual P24 normal/shear coupling; no scalar fallback.
  metric: {model: square_affine}
  frozen_preview: true
